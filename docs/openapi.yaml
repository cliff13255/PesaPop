openapi: 3.1.0
info:
  title: PesaPop API
  version: 0.2.0
  summary: PesaPop demo API (Supabase Edge Function `api`).
  description: |
    The web frontend (Vercel) talks ONLY to this API. It never calls Claude or PayHero directly.

    MVP demo rules:
    - No user accounts. Every browser sends a random id in `X-Demo-Session`; customers see
      only their own payments. The Merchant view shows every payment (phone numbers masked)
      for one built-in demo shop.
    - If the server sets a demo passcode, every call except /health, /config and webhooks
      must send it in `X-Demo-Code`.
    - Payments use M-Pesa STK Push through PayHero (`provider_mode` live; PayHero has no sandbox), or a clearly
      labelled `simulated` mode that moves no money.
    - Amounts are whole KES, capped at `max_amount` from /config. Phones are E.164 (+2547... / +2541...).
    - Statuses are exactly pending, success, failed.
    - Only `POST /payments/{confirmation_id}/confirm` sends an STK push. It is idempotent.
    - Errors are `{ "error": { "code", "message" } }`.
servers:
  - url: http://localhost:8787/api
    description: Local (npm run dev:api)
  - url: https://{project_ref}.supabase.co/functions/v1/api
    description: Supabase Edge Function
    variables:
      project_ref:
        default: your-project-ref

security:
  - demoSession: []

paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /config:
    get:
      operationId: getConfig
      summary: Public demo settings the UI needs
      security: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }

  /assistant/messages:
    post:
      operationId: assistantMessage
      summary: Talk to the payment assistant (it can draft, never confirm)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantMessageRequest" }
      responses:
        "200":
          description: Reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantMessageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Assistant failed (code `assistant_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /payments:
    post:
      operationId: createPayment
      summary: Create a payment draft (no money moves)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDraftResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }

  /payments/{confirmation_id}/confirm:
    post:
      operationId: confirmPayment
      summary: Confirm a draft and send the M-Pesa STK push (the ONLY money-moving call)
      description: Only the browser that created the draft may confirm it. Idempotent.
      parameters:
        - name: confirmation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Started (or already started)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmPaymentResponse" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Draft expired (code `draft_expired`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /payments/{id}:
    get:
      operationId: getPayment
      summary: Current status of a payment (phone masked unless it is this browser's)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions:
    get:
      operationId: listTransactions
      summary: This browser's payments, newest first
      parameters:
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }

  /payment-requests:
    post:
      operationId: createPaymentRequest
      summary: Merchant asks a customer to pay (creates a draft; confirm sends the STK push to the customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequestRequest" }
      responses:
        "201":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDraftResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }

  /merchant/summary:
    get:
      operationId: merchantSummary
      summary: Totals and counts by status for the demo shop
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSummary" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }

  /merchant/transactions:
    get:
      operationId: merchantTransactions
      summary: Every demo payment, newest first, phones masked except this browser's own
      parameters:
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AccessCodeRequired" }

  /webhooks/payhero:
    post:
      operationId: payheroCallback
      summary: PayHero STK Push result callback (server to server)
      description: Authenticated by the secret `token` query parameter set in the callback URL. Applies once per payment.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Bad token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: header
      name: X-Demo-Session
      description: Random id (16-64 chars of A-Z a-z 0-9 _ -) generated once per browser.

  parameters:
    Status:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/PaymentStatus" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Invalid input (code `validation_error`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccessCodeRequired:
      description: Demo passcode missing or wrong (code `access_code_required`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (code `not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Demo limit reached (code `rate_limited`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }

    PublicConfig:
      type: object
      additionalProperties: false
      required: [provider_mode, assistant_mode, max_amount, access_code_required, shop_name]
      properties:
        provider_mode: { type: string, enum: [simulated, live] }
        assistant_mode: { type: string, enum: [claude, rules] }
        max_amount: { type: integer, minimum: 1 }
        access_code_required: { type: boolean }
        shop_name: { type: string }

    Phone:
      type: string
      pattern: "^\\+254(7|1)[0-9]{8}$"
      example: "+254712345678"
    MaskedPhone:
      type: string
      description: E.164, or masked like +2547******78 when it belongs to another browser.
      example: "+2547******78"
    Amount:
      type: integer
      minimum: 1
      example: 500
    PaymentStatus:
      type: string
      enum: [pending, success, failed]
    Kind:
      type: string
      enum: [payment, request]
      description: payment = customer paid someone; request = merchant asked a customer to pay.
    Timestamp:
      type: string
      format: date-time

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, phone, recipient]
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        phone:
          description: Number that receives the M-Pesa prompt.
          allOf: [{ $ref: "#/components/schemas/Phone" }]
        recipient: { type: string, minLength: 1, maxLength: 100 }
        reference: { type: string, minLength: 1, maxLength: 64 }

    CreatePaymentRequestRequest:
      type: object
      additionalProperties: false
      required: [amount, customer_phone, description]
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        customer_phone: { $ref: "#/components/schemas/Phone" }
        description: { type: string, minLength: 1, maxLength: 140 }

    PaymentSummary:
      type: object
      additionalProperties: false
      required: [kind, method, amount, fee, total, currency, phone, recipient, reference, expires_at]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        method: { type: string, const: mpesa_stk }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        currency: { type: string, const: KES }
        phone: { $ref: "#/components/schemas/Phone" }
        recipient: { type: string }
        reference: { type: ["string", "null"] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    PaymentDraftResponse:
      type: object
      additionalProperties: false
      required: [payment_summary, confirmation_id]
      properties:
        payment_summary: { $ref: "#/components/schemas/PaymentSummary" }
        confirmation_id: { type: string }

    ConfirmPaymentResponse:
      type: object
      additionalProperties: false
      required: [id, status, confirmation_id]
      properties:
        id: { type: string }
        status:
          description: pending once the prompt is sent, failed if it could not be sent. Never success here on first confirm.
          allOf: [{ $ref: "#/components/schemas/PaymentStatus" }]
        confirmation_id: { type: string }

    Payment:
      type: object
      additionalProperties: false
      required: [id, kind, status, method, provider, amount, fee, total, currency, phone, recipient, reference, mpesa_receipt, paid_at, failure_reason, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        method: { type: string, const: mpesa_stk }
        provider: { type: string, enum: [payhero, simulated] }
        amount: { $ref: "#/components/schemas/Amount" }
        fee: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        currency: { type: string, const: KES }
        phone: { $ref: "#/components/schemas/MaskedPhone" }
        recipient: { type: string }
        reference: { type: ["string", "null"] }
        mpesa_receipt: { type: ["string", "null"], description: "Set only when status is success." }
        paid_at: { type: ["string", "null"], format: date-time }
        failure_reason: { type: ["string", "null"], description: "Set only when status is failed." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    TransactionItem:
      type: object
      additionalProperties: false
      required: [id, kind, reference, amount, currency, method, recipient, phone, created_at, status]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
        reference: { type: string, description: "M-Pesa receipt when paid, otherwise the payment id." }
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { type: string, const: KES }
        method: { type: string, const: mpesa_stk }
        recipient: { type: string }
        phone: { $ref: "#/components/schemas/MaskedPhone" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/PaymentStatus" }

    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    TransactionList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TransactionItem" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    StatusBucket:
      type: object
      additionalProperties: false
      required: [count, total]
      properties:
        count: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    MerchantSummary:
      type: object
      additionalProperties: false
      required: [shop_name, currency, total_received, success, pending, failed]
      properties:
        shop_name: { type: string }
        currency: { type: string, const: KES }
        total_received: { type: integer, minimum: 0 }
        success: { $ref: "#/components/schemas/StatusBucket" }
        pending: { $ref: "#/components/schemas/StatusBucket" }
        failed: { $ref: "#/components/schemas/StatusBucket" }

    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        conversation_id: { type: string }

    AssistantMessageResponse:
      type: object
      additionalProperties: false
      required: [conversation_id, reply, missing_fields, payment_summary, confirmation_id, assistant_mode]
      properties:
        conversation_id: { type: string }
        reply: { type: string }
        missing_fields:
          type: array
          items: { type: string, enum: [amount, recipient, phone] }
        payment_summary:
          oneOf:
            - $ref: "#/components/schemas/PaymentSummary"
            - type: "null"
        confirmation_id: { type: ["string", "null"] }
        assistant_mode: { type: string, enum: [claude, rules] }
